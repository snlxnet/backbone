<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
    <title>Backbone</title>
  </head>
  <body>
    <main class="container">
      <h1>Backbone</h1>

      <input type="url" placeholder="url" id="url">

      <input type="sh" placholder="termux sh" id="sh" value="python3 -m http.serve">
    </main>

    <script>
      url.onchange = () => backbone.replaceApp(urlInput.value)
      sh.onchange = () => {
        fetch("http://127.0.0.1:2077/sh", { method: "POST", body: sh.value })
        backbone.showToast("sent: " + sh.value)
        sh.value = ""
      }
    </script>
  </body>
</html>
