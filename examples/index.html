<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
    <title>Backbone</title>
  </head>
  <body>
    <main class="container">
      <h1>Backbone</h1>

      <input type="url" placeholder="url" id="url">

      <input type="sh" placholder="termux sh" id="sh">

      <button id="rel">Reload</button>

      <button id="becentral">Be Central</button>
      <button id="beperipheral">Be Peripheral</button>
      <button id="beperipheral2">Be Peripheral 2</button>
      <button id="sendhi">Send Hi</button>
      <button id="sendhi2">Send Hi</button>

      <pre id="pretext"></pre>
    </main>

    <script>
      backbone.onBleMessage = (device, msg) => pretext.textContent += device + ": " + msg + "\n"
      backbone.onBleMessage?.("none", "sanity check")

      becentral.onclick = () => backbone.bleCentral(["per-1", "per-2", "cp-test"])
      beperipheral.onclick = () => backbone.blePeripheral("per-1")
      beperipheral2.onclick = () => backbone.blePeripheral("per-2")
      sendhi.onclick = () => backbone.send("hi", "per-1")
      sendhi2.onclick = () => backbone.send("hi", "per-2")

      url.onchange = () => backbone.replaceApp(url.value)
      sh.onchange = () => {
        fetch("http://127.0.0.1:2077/sh", { method: "POST", body: sh.value })
          .then((res) => backbone.showToast("termux: " + res.statusText))
          .catch(() => backbone.showToast("Failed to fetch"))
      }
      rel.onclick = () => window.location.reload()
    </script>
  </body>
</html>
